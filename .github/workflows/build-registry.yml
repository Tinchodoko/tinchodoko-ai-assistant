name: Build Registry

on:
  workflow_run:
    workflows: ["Android Release APK"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: build-registry
  cancel-in-progress: false

jobs:
  update-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Generate complete build registry
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import subprocess
          import time

          repo = os.environ["REPO"]
          token = os.environ["GH_TOKEN"]

          def gh_api(path):
              for attempt in range(4):
                  result = subprocess.run(
                      ["curl", "-fsSL",
                       "-H", "Accept: application/vnd.github+json",
                       "-H", f"Authorization: Bearer {token}",
                       "-H", "X-GitHub-Api-Version: 2022-11-28",
                       f"https://api.github.com{path}"],
                      capture_output=True, text=True
                  )
                  if result.returncode == 0:
                      return json.loads(result.stdout)
                  if attempt == 3:
                      raise RuntimeError(f"GitHub API request failed: {path}: {result.stderr}")
                  time.sleep(2 ** attempt)

          runs = []
          for page in range(1, 21):
              data = gh_api(f"/repos/{repo}/actions/workflows/build.yml/runs?per_page=100&page={page}")
              page_runs = data.get("workflow_runs", [])
              runs.extend(page_runs)
              if len(page_runs) < 100:
                  break

          entries = []
          for run in runs:
              entry = {
                  "run_number": run.get("run_number"),
                  "run_id": run.get("id"),
                  "status": run.get("status"),
                  "conclusion": run.get("conclusion"),
                  "display_title": run.get("display_title") or run.get("name") or "Build",
                  "event": run.get("event"),
                  "branch": run.get("head_branch"),
                  "sha": run.get("head_sha"),
                  "created_at": run.get("created_at"),
                  "updated_at": run.get("updated_at"),
                  "run_url": run.get("html_url"),
                  "failed_step": None,
                  "failed_steps": []
              }

              jobs = gh_api(f"/repos/{repo}/actions/runs/{run['id']}/jobs?per_page=100")
              failed_steps = []
              for job in jobs.get("jobs", []):
                  for step in job.get("steps", []):
                      if step.get("conclusion") == "failure":
                          failed_steps.append({
                              "job": job.get("name"),
                              "step": step.get("name"),
                              "started_at": step.get("started_at"),
                              "completed_at": step.get("completed_at")
                          })
              entry["failed_steps"] = failed_steps
              if failed_steps:
                  entry["failed_step"] = failed_steps[0]["step"]
              entries.append(entry)

          entries.sort(key=lambda x: (int(x.get("run_number") or -1), int(x.get("run_id") or -1)))

          registry = {
              "schema_version": 1,
              "generated_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
              "workflow": "Android Release APK",
              "repository": repo,
              "builds": entries
          }

          with open("build-registry.json", "w", encoding="utf-8") as f:
              json.dump(registry, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Commit registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-registry.json
          if git diff --cached --quiet; then
            echo "Registry unchanged."
            exit 0
          fi
          git commit -m "chore(build): update build registry [skip ci]"
          git push origin main
