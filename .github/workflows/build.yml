name: Android Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: android-release-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Capture build change
        run: |
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "BUILD_CHANGE=$(git log -1 --pretty=%s)" >> "$GITHUB_ENV"

      - name: Install dependencies
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install npm packages
        run: npm install

      - name: Generate Android project
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('app.json','utf8')); p.expo.version='1.0.'+process.env.BUILD_NUMBER; p.expo.android.versionCode=Number(process.env.BUILD_NUMBER); fs.writeFileSync('app.json', JSON.stringify(p,null,2)+'\n')"
          CI=1 npx expo prebuild --platform android

      - name: Prepare build changelog
        run: |
          printf '%s\n' "- #V${BUILD_NUMBER} — ${BUILD_CHANGE}" > CHANGELOG.new
          cat CHANGELOG.md >> CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md

      - name: Configure permanent Android release signing
        env:
          AIASSISTANT_SIGNING_KEYSTORE_BASE64: ${{ secrets.AIASSISTANT_SIGNING_KEYSTORE_BASE64 }}
          AIASSISTANT_SIGNING_STORE_PASSWORD: ${{ secrets.AIASSISTANT_SIGNING_STORE_PASSWORD }}
          AIASSISTANT_SIGNING_KEY_ALIAS: ${{ secrets.AIASSISTANT_SIGNING_KEY_ALIAS }}
          AIASSISTANT_SIGNING_KEY_PASSWORD: ${{ secrets.AIASSISTANT_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for secret_name in \
            AIASSISTANT_SIGNING_KEYSTORE_BASE64 \
            AIASSISTANT_SIGNING_STORE_PASSWORD \
            AIASSISTANT_SIGNING_KEY_ALIAS \
            AIASSISTANT_SIGNING_KEY_PASSWORD; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: ${secret_name}"
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/tinchodoko-release.jks"
          printf '%s' "$AIASSISTANT_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"

          SIGNATURE=$(keytool -list -v \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$AIASSISTANT_SIGNING_STORE_PASSWORD" \
            -alias "$AIASSISTANT_SIGNING_KEY_ALIAS" \
            | awk -F': ' '/SHA256:/{print $2; exit}')

          if [ -z "$SIGNATURE" ]; then
            echo "::error::Could not read the signing certificate SHA-256 fingerprint."
            exit 1
          fi
          echo "APP_SIGNATURE=$SIGNATURE" >> "$GITHUB_ENV"
          echo "AIASSISTANT_SIGNING_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle_file = Path("android/app/build.gradle")
          source = gradle_file.read_text(encoding="utf-8")

          def find_block(text, name, start=0):
              match = re.search(r"\b" + re.escape(name) + r"\s*\{", text[start:])
              if not match:
                  return None
              block_start = start + match.start()
              opening = start + match.end() - 1
              depth = 0
              for index in range(opening, len(text)):
                  if text[index] == "{":
                      depth += 1
                  elif text[index] == "}":
                      depth -= 1
                      if depth == 0:
                          return block_start, opening, index
              raise SystemExit(f"Unclosed Gradle block: {name}")

          android_block = find_block(source, "android")
          if not android_block:
              raise SystemExit("Could not find android block in generated Gradle file")
          _, android_open, android_close = android_block

          release_config = """
              release {
                  storeFile file(System.getenv("AIASSISTANT_SIGNING_KEYSTORE_PATH"))
                  storePassword System.getenv("AIASSISTANT_SIGNING_STORE_PASSWORD")
                  keyAlias System.getenv("AIASSISTANT_SIGNING_KEY_ALIAS")
                  keyPassword System.getenv("AIASSISTANT_SIGNING_KEY_PASSWORD")
              }
          """

          signing_block = find_block(source, "signingConfigs", android_open)
          if signing_block and signing_block[0] < android_close:
              _, signing_open, _ = signing_block
              source = source[:signing_open + 1] + release_config + source[signing_open + 1:]
          else:
              build_types = find_block(source, "buildTypes", android_open)
              if not build_types or build_types[0] > android_close:
                  raise SystemExit("Could not find buildTypes block in generated Gradle file")
              insertion = '    signingConfigs {' + release_config + '    }\n'
              source = source[:build_types[0]] + insertion + source[build_types[0]:]

          android_block = find_block(source, "android")
          _, android_open, android_close = android_block
          build_types = find_block(source, "buildTypes", android_open)
          if not build_types or build_types[0] > android_close:
              raise SystemExit("Could not locate buildTypes block after adding signing config")
          _, build_types_open, build_types_close = build_types
          release_block = find_block(source, "release", build_types_open)
          if not release_block or release_block[0] > build_types_close:
              raise SystemExit("Could not find release buildType")
          _, release_open, release_close = release_block

          release_body = source[release_open + 1:release_close]
          signing_line = re.search(r"(?m)^(\s*)signingConfig\s+[^\n]+", release_body)
          if signing_line:
              replacement_line = signing_line.group(1) + "signingConfig signingConfigs.release"
              release_body = release_body[:signing_line.start()] + replacement_line + release_body[signing_line.end():]
          else:
              release_body = "\n            signingConfig signingConfigs.release" + release_body
          source = source[:release_open + 1] + release_body + source[release_close:]

          gradle_file.write_text(source, encoding="utf-8")
          print("Permanent release signing configured. Private key and passwords were not printed.")
          PY

      - name: Generate build metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os, json
          changes = [line[2:] for line in Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines() if line.startswith("- #V")]
          content = "export const BUILD_INFO = " + json.dumps({
              "appName": "Tinchodoko AI Assistant",
              "packageName": "com.tinchodoko.aiassistant",
              "version": "1.0." + os.environ["BUILD_NUMBER"],
              "build": os.environ["BUILD_NUMBER"],
              "signature": os.environ.get("APP_SIGNATURE", "UNKNOWN"),
              "changelog": changes,
          }, ensure_ascii=True, indent=2) + ";\n"
          Path("src/buildInfo.ts").write_text(content, encoding="utf-8")
          PY

      - name: TypeScript check
        run: npm run typecheck

      - name: Build signed release APK
        working-directory: android
        env:
          AIASSISTANT_SIGNING_STORE_PASSWORD: ${{ secrets.AIASSISTANT_SIGNING_STORE_PASSWORD }}
          AIASSISTANT_SIGNING_KEY_ALIAS: ${{ secrets.AIASSISTANT_SIGNING_KEY_ALIAS }}
          AIASSISTANT_SIGNING_KEY_PASSWORD: ${{ secrets.AIASSISTANT_SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apk-signature.txt"
          EXPECTED="$(printf '%s' "$APP_SIGNATURE" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          ACTUAL="$(sed -nE 's/.*certificate SHA-256 digest: ([0-9A-Fa-f:]+).*/\1/p' "$RUNNER_TEMP/apk-signature.txt" | head -n 1 | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [ -z "$ACTUAL" ] || [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::APK certificate does not match the configured permanent signing key."
            exit 1
          fi
          echo "APK signature verified against the permanent certificate."

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tinchodoko-ai-assistant-V${{ github.run_number }}-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Commit successful build changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --cached --quiet || git commit -m "chore(build): record #V${BUILD_NUMBER} [skip ci]"
          git push

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BUILD_NUMBER }}
          target_commitish: main
          name: Tinchodoko AI Assistant V${{ env.BUILD_NUMBER }}
          body_path: CHANGELOG.md
          files: android/app/build/outputs/apk/release/app-release.apk
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
