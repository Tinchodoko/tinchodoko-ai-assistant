name: 🤖 Build Tinchodoko AI Assistant APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: 🏗️ Build APK Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🧪 Python backend tests (Ed25519 vector + validation)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m unittest discover -s tests -t . -v
        working-directory: backend

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: ✅ Verificar Flutter
        run: flutter --version
        working-directory: flutter_project

      - name: 🤖 Generar estructura Android faltante
        run: |
          flutter create --platforms=android --org com.tinchodoko --project-name ai_assistant --overwrite /tmp/tinchodoko_android
          rm -rf android
          cp -R /tmp/tinchodoko_android/android android
          sed -i 's/android:label="ai_assistant"/android:label="Tinchodoko AI Assistant"/' android/app/src/main/AndroidManifest.xml
          # Keep the generated Android toolchain compatible with SDK 35 and current plugins.
          # AGP 8.6.1 supports API 35; Gradle 8.7 is its minimum compatible wrapper.
          sed -i 's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.6.1"/' android/settings.gradle
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.24"/' android/settings.gradle
          sed -i 's#distributionUrl=.*#distributionUrl=https\\://services.gradle.org/distributions/gradle-8.7-all.zip#' android/gradle/wrapper/gradle-wrapper.properties
          grep -E 'com.android.application|org.jetbrains.kotlin.android' android/settings.gradle
          grep 'distributionUrl=' android/gradle/wrapper/gradle-wrapper.properties
        working-directory: flutter_project

      - name: 📦 Instalar dependencias
        run: flutter pub get
        working-directory: flutter_project

      - name: 🧪 Ejecutar pruebas unitarias (Exness Ed25519)
        run: flutter test
        working-directory: flutter_project

      - name: 🔍 Analizar código
        run: flutter analyze --no-fatal-infos
        working-directory: flutter_project

      - name: 🔨 Build APK Release
        run: flutter build apk --release --no-tree-shake-icons --build-name=1.0.0 --build-number=${{ github.run_number }}
        working-directory: flutter_project

      - name: 📝 Renombrar APK
        run: |
          DATE=$(date +'%Y%m%d-%H%M')
          mv flutter_project/build/app/outputs/flutter-apk/app-release.apk \
             flutter_project/build/app/outputs/flutter-apk/TinchodokoAI-v${{ github.run_number }}-${DATE}.apk
          echo "APK_NAME=TinchodokoAI-v${{ github.run_number }}-${DATE}.apk" >> $GITHUB_ENV

      - name: 📤 Subir APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: TinchodokoAI-APK-v${{ github.run_number }}
          path: flutter_project/build/app/outputs/flutter-apk/TinchodokoAI-v*.apk
          retention-days: 30

      - name: 📝 Preparar notas de publicación
        run: |
          cat CHANGELOG.md > RELEASE_NOTES.md
          printf '\n---\n\n### 📥 Cómo instalar\n1. Descargá el archivo .apk de abajo\n2. Android: Ajustes → Seguridad → Fuentes desconocidas\n3. Abrí el APK e instalá\n\n### 🔑 Primer uso\n1. Tab APIs → Ingresá tus API Keys\n2. Tab Trading → Configurá el Gateway DNS mostrado por Exness en Key Management y conectá tu cuenta Demo\n3. La integración permanece en modo de solo lectura; no ejecuta operaciones.\n\n---\n' >> RELEASE_NOTES.md
          printf 'Build #%s — %s\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" >> RELEASE_NOTES.md

      - name: 🚀 Crear GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: "🤖 Tinchodoko AI Assistant v${{ github.run_number }}"
          body_path: RELEASE_NOTES.md
          files: flutter_project/build/app/outputs/flutter-apk/TinchodokoAI-v*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}